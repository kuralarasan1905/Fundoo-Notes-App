<div class="note-shared-wrapper">
  <div class="note-form-container" *ngIf="!searchText">
    <form
      [formGroup]="notes"
      class="note-form"
      [ngStyle]="{ 'background-color': selectedColor }"
    >
      <div class="form-content">
        <input
          formControlName="title"
          [placeholder]="isExpanded ? 'Title' : 'Take a note...'"
          class="note-input"
          type="text"
          (click)="expandForm()"
          (focus)="expandForm()"
        />

        <div class="collapsed-icons" *ngIf="!isExpanded">
          <button mat-icon-button class="icon-btn">
            <mat-icon>check_box</mat-icon>
          </button>
          <button mat-icon-button class="icon-btn">
            <mat-icon>brush</mat-icon>
          </button>
          <button mat-icon-button class="icon-btn">
            <mat-icon>image</mat-icon>
          </button>
        </div>
      </div>

      <button
        *ngIf="isExpanded"
        mat-icon-button
        class="pin-btn"
        (click)="togglePin()"
        [matTooltip]="isPinned ? 'Unpin' : 'Pin'"
        type="button"
      >
        <mat-icon class="pin-icon">{{
          isPinned ? "push_pin" : "push_pin"
        }}</mat-icon>
      </button>

      <textarea
        *ngIf="isExpanded"
        formControlName="description"
        placeholder="Take a note..."
        class="note-textarea"
        rows="3"
      ></textarea>

      <div *ngIf="isExpanded" class="form-footer">
        <app-icons
          [showAll]="true"
          (colorSelect)="onColorSelected($event)"
          (closeBtn)="onCloseNote($event)"
        ></app-icons>
      </div>
    </form>
  </div>

  <!-- PINNED + OTHERS conditional rendering -->
  <ng-container *ngIf="pinnedNotes.length > 0; else allNotes">
    <!-- PINNED -->
    <div class="note-section">
      <h4 class="section-heading">PINNED</h4>
      <div
        [ngClass]="viewMode === 'grid' ? 'note-grid grid' : 'note-grid list'"
      >
        <app-note-card
          *ngFor="let note of pinnedNotes"
          [note]="note"
          (openDialog)="onEditNote(note)"
          (archiveNote)="onArchiveNote($event)"
          (moveToTrash)="onTrashNote($event)"
          (togglePin)="onTogglePin($event)"
        ></app-note-card>
      </div>
    </div>

    <!-- OTHERS -->
    <div *ngIf="otherNotes.length > 0" class="note-section">
      <h4 class="section-heading">OTHERS</h4>
      <div
        [ngClass]="viewMode === 'grid' ? 'note-grid grid' : 'note-grid list'"
      >
        <app-note-card
          *ngFor="let note of otherNotes"
          [note]="note"
          (openDialog)="onEditNote(note)"
          (archiveNote)="onArchiveNote($event)"
          (moveToTrash)="onTrashNote($event)"
          (togglePin)="onTogglePin($event)"
        ></app-note-card>
      </div>
    </div>
  </ng-container>

  <!-- ELSE: Show all notes together when no pinned notes -->
  <ng-template #allNotes>
    <div [ngClass]="viewMode === 'grid' ? 'note-grid grid' : 'note-grid list'">
      <app-note-card
        *ngFor="let note of filteredNotes"
        [note]="note"
        (openDialog)="onEditNote(note)"
        (archiveNote)="onArchiveNote($event)"
        (moveToTrash)="onTrashNote($event)"
        (togglePin)="onTogglePin($event)"
      ></app-note-card>
    </div>
  </ng-template>
</div>
