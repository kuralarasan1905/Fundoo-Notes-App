<div class="note-form-container">
  <form
    [formGroup]="notes"
    class="note-form"
    [ngStyle]="{ 'background-color': selectedColor }"
  >
    <div class="form-content">
      <input
        formControlName="title"
        placeholder="Title"
        class="note-input"
        type="text"
        (click)="expandForm()"
        (focus)="expandForm()"
      />
    </div>

    <textarea
      *ngIf="isExpanded"
      formControlName="description"
      placeholder="Take a note..."
      class="note-textarea"
      rows="3"
    ></textarea>

    <div *ngIf="isExpanded" class="form-footer">
      <app-icons
        [showAll]="true"
        (colorSelect)="onColorSelected($event)"
        (closeBtn)="onCloseNote($event)"
      ></app-icons>
    </div>
  </form>
</div>

<div class="note-grid" [ngClass]="viewMode">
  <app-note-card
    *ngFor="let note of filteredNotes"
    [note]="note"
    (editNote)="onEditNote($event)"
    (deleteNote)="onDeleteNote($event)"
    (archiveNote)="onArchiveNote($event)"
  ></app-note-card>
</div>
