<form
  [formGroup]="notes"
  class="note-form"
  [ngStyle]="{ 'background-color': selectedColor }"
>
  <div class="form-content">
    <input
      formControlName="title"
      placeholder="Take a note..."
      class="note-input"
      type="text"
      (click)="expandForm()"
      (focus)="expandForm()"
    />

    <!-- ✅ icons shown in collapsed state -->
    <div class="collapsed-icons" *ngIf="!isExpanded">
      <button mat-icon-button class="icon-btn">
        <mat-icon>check_box</mat-icon>
      </button>
      <button mat-icon-button class="icon-btn">
        <mat-icon>brush</mat-icon>
      </button>
      <button mat-icon-button class="icon-btn">
        <mat-icon>image</mat-icon>
      </button>
    </div>
  </div>

  <textarea
    *ngIf="isExpanded"
    formControlName="description"
    placeholder="Take a note..."
    class="note-textarea"
    rows="3"
  ></textarea>

  <div *ngIf="isExpanded" class="form-footer">
    <app-icons
      [showAll]="true"
      (colorSelect)="onColorSelected($event)"
      (closeBtn)="onCloseNote($event)"
    ></app-icons>
  </div>
</form>
