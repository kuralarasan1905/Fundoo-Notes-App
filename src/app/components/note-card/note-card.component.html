<div
  class="note-card"
  [ngStyle]="{
    'background-color': isEditing ? noteColor : note.color || '#202124'
  }"
  (mouseenter)="hover = true"
  (mouseleave)="hover = false"
>
  <button
    mat-icon-button
    class="pin-btn"
    *ngIf="hover"
    (click)="togglePin.emit({ id: note.id, isPined: !note.isPined })"
    matTooltip="{{ note.isPined ? 'Unpin note' : 'Pin note' }}"
  >
    <mat-icon class="pin-icon">{{
      note.isPined ? "push_pin" : "push_pin"
    }}</mat-icon>
  </button>

  <div *ngIf="!isEditing" class="note-content" (click)="openDialog.emit()">
    <h3 *ngIf="note.title" class="note-title">{{ note.title }}</h3>
    <p class="note-description">{{ note.description }}</p>
  </div>

  <div *ngIf="isEditing" class="edit-content">
    <input
      [(ngModel)]="editTitle"
      placeholder="Title"
      class="edit-title"
      type="text"
    />
    <textarea
      [(ngModel)]="editDescription"
      placeholder="Take a note..."
      class="edit-description"
      rows="4"
    ></textarea>
  </div>

  <div class="note-footer">
    <div class="note-actions">
      <app-icons
        [showAll]="false"
        [isArchived]="note.isArchived ?? false"
        (colorSelect)="setColor($event)"
        (closeBtn)="onCancel()"
        (toggleArchive)="toggleArchiveStatus($event)"
        [inTrash]="inTrash"
        (moveToTrash)="onDelete()"
        (restoreNote)="restoreThisNote()"
        (deletePermanently)="deleteThisNoteForever()"
        (reminderSet)="addReminder($event)"
        (reminderRemove)="removeReminder()"
      ></app-icons>
    </div>
  </div>
</div>
