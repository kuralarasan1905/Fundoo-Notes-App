<mat-toolbar class="toolbar">
  <button
    mat-icon-button
    class="menu-btn"
    (click)="toggle.emit()"
    *ngIf="!isSearchOpen"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <img src="assets/keep.png" alt="Logo" class="logo" *ngIf="!isSearchOpen" />
  <span class="title" *ngIf="!isSearchOpen">{{ title }}</span>

  <div
    class="search-bar"
    [class.expanded]="isSearchOpen"
    *ngIf="isSearchOpen || isLargeScreen"
  >
    <button
      mat-icon-button
      class="back-btn"
      *ngIf="!isLargeScreen"
      (click)="closeSearch()"
    >
      <mat-icon>arrow_back</mat-icon>
    </button>
    <mat-icon class="search-icon">search</mat-icon>
    <input
      matInput
      placeholder="Search"
      [(ngModel)]="searchQuery"
      (input)="onSearchInput($event)"
    />
  </div>

  <div class="actions">
    <button
      mat-icon-button
      class="search-toggle"
      *ngIf="!isLargeScreen && !isSearchOpen"
      (click)="openSearch()"
    >
      <mat-icon>search</mat-icon>
    </button>

    <div class="cont1">
      <button mat-icon-button (click)="onRefresh()">
        <mat-icon>refresh</mat-icon>
      </button>
      <button mat-icon-button (click)="toggleView()" *ngIf="isLargeScreen">
        <mat-icon>{{ isGridView ? "view_agenda" : "grid_view" }}</mat-icon>
      </button>
      <button mat-icon-button [matMenuTriggerFor]="settingsMenu">
        <mat-icon>settings</mat-icon>
      </button>
    </div>

    <div class="cont2">
      <button mat-icon-button><mat-icon>apps</mat-icon></button>
      <button mat-icon-button><mat-icon>account_circle</mat-icon></button>
    </div>
  </div>
</mat-toolbar>

<mat-menu #settingsMenu="matMenu">
  <button mat-menu-item (click)="toggleTheme()">
    {{ isDarkTheme ? "Enable light theme" : "Enable dark theme" }}
  </button>
  <button mat-menu-item>Send feedback</button>
  <button mat-menu-item>Help</button>
  <button mat-menu-item>App downloads</button>
  <button mat-menu-item>Keyboard shortcuts</button>
</mat-menu>
