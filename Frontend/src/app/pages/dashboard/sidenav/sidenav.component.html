<div class="sidebar-container" [class.expanded]="isExpanded || hoverLabel">
  <ng-container *ngFor="let item of navItems">
    <button
      mat-button
      class="sidebar-btn"
      [class.active]="selectedLabel === item.label"
      [class.collapsed]="
        selectedLabel === item.label && !(isExpanded || hoverLabel)
      "
      (click)="select(item.label, item.route)"
      (mouseenter)="setHover(item.label)"
      (mouseleave)="clearHover()"
      [matTooltip]="!(isExpanded || hoverLabel) ? item.label : ''"
      matTooltipPosition="right"
    >
      <mat-icon>{{ item.icon }}</mat-icon>
      <span *ngIf="isExpanded || hoverLabel">{{ item.label }}</span>
    </button>
  </ng-container>

  <!-- Labels Section -->
  <div class="labels-section" *ngIf="labels.length > 0">
    <ng-container *ngFor="let label of labels">
      <button
        mat-button
        class="sidebar-btn label-btn"
        [class.active]="selectedLabel === (label.label || label.name)"
        [class.collapsed]="
          selectedLabel === (label.label || label.name) && !(isExpanded || hoverLabel)
        "
        (click)="selectLabel(label)"
        (mouseenter)="setHover(label.label || label.name || '')"
        (mouseleave)="clearHover()"
        [matTooltip]="!(isExpanded || hoverLabel) ? (label.label || label.name) : ''"
        matTooltipPosition="right"
      >
        <mat-icon>label_outline</mat-icon>
        <span *ngIf="isExpanded || hoverLabel">{{ label.label || label.name }}</span>
      </button>
    </ng-container>
  </div>

  <div class="sidebar-footer" *ngIf="isExpanded || hoverLabel">
    <button mat-button class="sidebar-btn">
      <span>Open-source licenses</span>
    </button>
  </div>
</div>
