<div class="layout">
  <app-toolbar
    (toggle)="toggleSidebar()"
    (viewToggle)="handleViewToggle($event)"
    (search)="onSearchChange($event)"
  />

  <div class="body">
    <div class="sidenav" [ngClass]="{ expanded: isSidebarOpen }">
      <app-sidenav [isExpanded]="isSidebarOpen" />
    </div>

    <div class="main-content" [style.marginLeft.px]="isSidebarOpen ? 240 : 72">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
