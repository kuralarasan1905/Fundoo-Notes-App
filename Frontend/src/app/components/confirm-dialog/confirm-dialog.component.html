<div class="dialog-content">
  <p class="dialog-message">Delete notes forever?</p>

  <div class="dialog-actions">
    <button mat-button (click)="close(false)" class="cancel-btn">Cancel</button>
    <button mat-button color="primary" (click)="close(true)" class="delete-btn">
      Delete
    </button>
  </div>
</div>
